---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH from anywhere (bootstrap)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: not firewall_ssh_vpn_only

- name: Allow SSH only on the VPN interface
  community.general.ufw:
    rule: allow
    interface: wg0
    direction: in
    port: "22"
    proto: tcp
  when: firewall_ssh_vpn_only

- name: Remove global SSH rule
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true
  when: firewall_ssh_vpn_only

- name: Allow service ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable ufw
  community.general.ufw:
    state: enabled

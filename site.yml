---
- name: Base hardening (SSH + firewall)
  hosts: containers
  become: true
  roles:
    - ssh_hardening
    - firewall

- name: WireGuard VPN
  hosts: vpn
  become: true
  roles:
    - wireguard

- name: Log storage and dashboards (Loki + Grafana)
  hosts: monitoring
  become: true
  roles:
    - grafana_apt_repo
    - loki
    - grafana

- name: Web server with WAF and log shipper
  hosts: web
  become: true
  roles:
    - nginx_waf
    - grafana_apt_repo
    - alloy

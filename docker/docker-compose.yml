services:
  ubu1:
    build: .
    container_name: ubu1
    hostname: ubu1
    privileged: true
    ports:
      - "2221:22"
      - "8080:80"
    networks:
      lab:
        ipv4_address: 172.28.0.11

  ubu2:
    build: .
    container_name: ubu2
    hostname: ubu2
    privileged: true
    ports:
      - "2222:22"
    networks:
      lab:
        ipv4_address: 172.28.0.12
    volumes:
      - ubu2_loki:/var/lib/loki
      - ubu2_grafana:/var/lib/grafana
      - ubu2_wg:/etc/wireguard

volumes:
  ubu2_loki:
  ubu2_grafana:
  ubu2_wg:

networks:
  lab:
    ipam:
      config:
        - subnet: 172.28.0.0/24
